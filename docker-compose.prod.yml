# ──────────────────────────────────────────────────────────────────────────────
# ResearchMate – Production Docker Compose
# ──────────────────────────────────────────────────────────────────────────────
services:
  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    image: ${ECR_REGISTRY}/researchmate-api:${IMAGE_TAG:-latest}
    container_name: researchmate_api
    restart: unless-stopped
    command: ["bash", "scripts/entrypoint.sh"]
    # Bound to loopback interface only — reverse proxy (Nginx/Caddy) terminates TLS
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-researchmate}}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NUMBA_CACHE_DIR: /tmp
      MPLCONFIGDIR: /tmp
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      redis:
        condition: service_healthy
    # No source volume mounts in production — code is sealed inside image
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - researchmate_net

  # ── PostgreSQL Database with pgvector (Optional local fallback) ───────────
  db:
    image: pgvector/pgvector:pg15
    container_name: researchmate_db
    restart: unless-stopped
    profiles:
      - local-db
    # PORTS OMITTED INTENTIONALLY – accessible ONLY via internal container network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-researchmate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-researchmate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - researchmate_net

  # ── Redis Cache / Broker ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: researchmate_redis
    restart: unless-stopped
    # PORTS OMITTED INTENTIONALLY – accessible ONLY via internal container network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - researchmate_net

networks:
  researchmate_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
