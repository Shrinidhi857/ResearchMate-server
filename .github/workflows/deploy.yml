name: CI/CD – Test, Build & Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: researchmate-api
  PYTHON_VERSION: "3.11"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Quality Gate: Linting (Ruff)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ruff
        run: pip install "ruff>=0.1.0"

      - name: Run ruff lint check
        run: ruff check app/ tests/ --select E,F,W --ignore E501

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Quality Gate: Test Suite (pytest + in-memory SQLite)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: "sqlite:///./test_researchmate.db"
      JWT_SECRET_KEY: "ci-jwt-secret-do-not-use-in-prod"
      SECRET_KEY: "ci-secret-do-not-use-in-prod"
      GEMINI_API_KEY: "ci-fake-gemini-key"
      GOOGLE_CLIENT_ID: "ci-fake-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-fake-google-client-secret"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Build & Push Docker Image to Amazon ECR (OIDC Auth)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - No Long-Lived Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Deploy to AWS EC2 via SSH
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code for Config Sync
        uses: actions/checkout@v4

      - name: Copy Production Compose and Nginx Configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf,scripts/backup.sh"
          target: "/opt/researchmate"

      - name: Execute Deployment Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REPOSITORY,IMAGE_TAG
          script: |
            set -e
            cd /opt/researchmate

            # Authenticate Docker with Amazon ECR using the EC2 Instance Profile (IAM Role)
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull latest application image from ECR
            export ECR_REGISTRY="$ECR_REGISTRY"
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml pull api

            # Recreate containers with zero manual downtime
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up dangling images to prevent EBS storage exhaustion
            docker image prune -f

            # Health verification
            sleep 15
            curl -f http://127.0.0.1:5000/health || exit 1
            echo "✅ Deployment succeeded and API is healthy!"
