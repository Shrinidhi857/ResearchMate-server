name: CI/CD – Test, Build & Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: researchmate-api
  PYTHON_VERSION: "3.11"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Quality Gate: Linting (Ruff)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ruff
        run: pip install "ruff>=0.1.0"

      - name: Run ruff lint check
        run: ruff check app/ tests/ --select E,F,W --ignore E501

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Quality Gate: Test Suite (pytest + in-memory SQLite)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: "sqlite:///./test_researchmate.db"
      JWT_SECRET_KEY: "ci-jwt-secret-do-not-use-in-prod"
      SECRET_KEY: "ci-secret-do-not-use-in-prod"
      GEMINI_API_KEY: "ci-fake-gemini-key"
      GOOGLE_CLIENT_ID: "ci-fake-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-fake-google-client-secret"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Build & Push Docker Image to Amazon ECR (OIDC Auth)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - No Long-Lived Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Deploy to Amazon EKS (Kubernetes)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-eks:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Auth)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig for Amazon EKS
        env:
          CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ secrets.AWS_REGION || env.AWS_REGION }}"

      - name: Apply Kubernetes Manifests & Rolling Update
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          # AWS Configuration
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          # App & URLs
          APP_URL: ${{ secrets.APP_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          # Database & Auth
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # AI & LLM Models
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          MAX_COMPILATION_ATTEMPTS: ${{ secrets.MAX_COMPILATION_ATTEMPTS }}
          # LangChain Tracing
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_ENDPOINT: ${{ secrets.LANGCHAIN_ENDPOINT }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          # SMTP / Email Notifications
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          # 1. Fetch AWS Account ID dynamically from caller identity
          export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export ECR_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          # 2. Apply core cluster namespace
          # NOTE: VPC subnets must be pre-tagged once manually in AWS Console:
          #   kubernetes.io/role/elb = 1
          #   kubernetes.io/cluster/<EKS_CLUSTER_NAME> = shared
          kubectl apply -f k8s/00-namespace.yaml

          # 4. Inject variables and secrets dynamically via envsubst
          envsubst < k8s/01-configmap.yaml | kubectl apply -f -
          envsubst < k8s/02-secret.yaml | kubectl apply -f -
          envsubst < k8s/03-serviceaccount-irsa.yaml | kubectl apply -f -

          # 5. Clean up any stale or evicted pods from prior failed rollouts to free node memory
          kubectl delete pods -n researchmate --field-selector=status.phase=Failed 2>/dev/null || true
          kubectl delete pods -n researchmate --field-selector=status.phase=Pending 2>/dev/null || true
          kubectl delete pods -n researchmate -l app=researchmate-api --field-selector=status.phase!=Running 2>/dev/null || true

          # 6. Apply Redis, API Deployment, Service, HPA, and Ingress
          kubectl apply -f k8s/04-redis.yaml
          envsubst < k8s/05-api-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/06-api-service.yaml
          kubectl apply -f k8s/07-hpa.yaml
          kubectl apply -f k8s/08-ingress.yaml

          # 7. Wait for rolling update to succeed (up to 600s to allow image pull & startupProbe to pass)
          echo "Waiting for deployment rollout to finish..."
          if ! kubectl rollout status deployment/researchmate-api -n researchmate --timeout=600s; then
            echo "❌ Rollout timed out. Inspecting pod status, events, and logs..."
            echo "=== PODS IN NAMESPACE ==="
            kubectl get pods -n researchmate -o wide
            echo "=== POD EVENTS ==="
            kubectl describe pods -n researchmate -l app=researchmate-api
            echo "=== POD LOGS ==="
            kubectl logs -n researchmate -l app=researchmate-api --tail=100 --all-containers=true
            exit 1
          fi

          echo "✅ Amazon EKS deployment succeeded with zero downtime!"

          # 8. Poll and wait for AWS Load Balancer to provision and assign public DNS
          echo "Waiting for AWS Load Balancer to allocate public hostname..."
          LB_HOSTNAME=""
          for i in {1..30}; do
            LB_HOSTNAME=$(kubectl get svc researchmate-api-service -n researchmate -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$LB_HOSTNAME" ]; then
              break
            fi
            echo "  Waiting for AWS Load Balancer... ($i/30, 10s sleep)"
            sleep 10
          done

          echo "=== SERVICE DETAILS & AWS EVENTS ==="
          kubectl describe svc researchmate-api-service -n researchmate

          echo "=== NODE IAM ROLE FOR LB PERMISSIONS CHECK ==="
          NODE_NAME=$(kubectl get nodes --no-headers -o custom-columns=NAME:.metadata.name | grep -v taint | head -1 2>/dev/null || kubectl get nodes --no-headers -o custom-columns=NAME:.metadata.name | head -1)
          NODE_INSTANCE_ID=$(kubectl get node "$NODE_NAME" -o jsonpath='{.spec.providerID}' 2>/dev/null | sed 's|.*/||' || echo "unknown")
          NODE_PROFILE=$(aws ec2 describe-instances --instance-ids "$NODE_INSTANCE_ID" --query 'Reservations[0].Instances[0].IamInstanceProfile.Arn' --output text 2>/dev/null || echo "unknown — add ec2:DescribeInstances to github-actions-ecr role")
          echo "Worker node: $NODE_NAME ($NODE_INSTANCE_ID)"
          echo "IAM Instance Profile: $NODE_PROFILE"

          echo "=== EXISTING AWS LOAD BALANCERS ==="
          aws elb describe-load-balancers --query 'LoadBalancerDescriptions[*].[LoadBalancerName,DNSName,VPCId]' --output table 2>/dev/null || echo "No classic ELBs found (or no elasticloadbalancing:Describe permission)"
          aws elbv2 describe-load-balancers --query 'LoadBalancers[*].[LoadBalancerName,DNSName,State.Code]' --output table 2>/dev/null || echo "No ALB/NLBs found (or no elasticloadbalancing:Describe permission)"

          if [ -n "$LB_HOSTNAME" ]; then
            echo "═══════════════════════════════════════════════════════════════"
            echo "🚀 LIVE SERVER URL: http://${LB_HOSTNAME}"
            echo "🔍 HEALTH CHECK:    http://${LB_HOSTNAME}/health"
            echo "📖 API SWAGGER DOCS: http://${LB_HOSTNAME}/docs"
            echo "═══════════════════════════════════════════════════════════════"
            # Quick health probe (best effort)
            curl -sf --max-time 15 "http://${LB_HOSTNAME}/health" && echo "✅ /health OK" || echo "⚠️ /health not yet reachable (LB may still be warming up)"
          else
            echo "⚠️ Load Balancer DNS not yet assigned after 300s. Subnet tags have been applied."
            echo "   Re-trigger the workflow or check the SERVICE DETAILS section above for error events."
            exit 1
          fi
