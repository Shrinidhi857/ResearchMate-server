name: CI/CD – Test, Build & Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: researchmate-api
  PYTHON_VERSION: "3.11"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Quality Gate: Linting (Ruff)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ruff
        run: pip install "ruff>=0.1.0"

      - name: Run ruff lint check
        run: ruff check app/ tests/ --select E,F,W --ignore E501

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Quality Gate: Test Suite (pytest + in-memory SQLite)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: "sqlite:///./test_researchmate.db"
      JWT_SECRET_KEY: "ci-jwt-secret-do-not-use-in-prod"
      SECRET_KEY: "ci-secret-do-not-use-in-prod"
      GEMINI_API_KEY: "ci-fake-gemini-key"
      GOOGLE_CLIENT_ID: "ci-fake-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-fake-google-client-secret"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Build & Push Docker Image to Amazon ECR (OIDC Auth)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - No Long-Lived Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Deploy to Amazon EKS (Kubernetes)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-eks:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Auth)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig for Amazon EKS
        env:
          CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}"

      - name: Apply Kubernetes Manifests & Rolling Update
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # 1. Fetch AWS Account ID dynamically from caller identity
          export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # 2. Apply core cluster namespace
          kubectl apply -f k8s/00-namespace.yaml

          # 3. Inject variables and secrets dynamically via envsubst
          envsubst < k8s/01-configmap.yaml | kubectl apply -f -
          envsubst < k8s/02-secret.yaml | kubectl apply -f -
          envsubst < k8s/03-serviceaccount-irsa.yaml | kubectl apply -f -

          # 4. Apply Redis, Service, HPA, and Ingress
          kubectl apply -f k8s/04-redis.yaml
          kubectl apply -f k8s/06-api-service.yaml
          kubectl apply -f k8s/07-hpa.yaml
          kubectl apply -f k8s/08-ingress.yaml

          # 5. Trigger rolling update of API pods with newly pushed commit image
          ECR_IMAGE="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          # Update the container image in the deployment
          kubectl set image deployment/researchmate-api api="$ECR_IMAGE" -n researchmate --record

          # 6. Wait for zero-downtime rolling update to succeed
          echo "Waiting for deployment rollout to finish..."
          kubectl rollout status deployment/researchmate-api -n researchmate --timeout=180s

          echo "✅ Amazon EKS deployment succeeded with zero downtime!"
