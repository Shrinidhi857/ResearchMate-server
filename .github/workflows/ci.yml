name: CI – Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ruff
        run: pip install ruff>=0.1.0

      - name: Run ruff lint
        run: ruff check app/ tests/ --select E,F,W --ignore E501

  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (pytest + SQLite)
    runs-on: ubuntu-latest
    needs: lint

    # All secrets used only at runtime — tests use mocked/SQLite equivalents
    env:
      DATABASE_URL: "sqlite:///./test_researchmate.db"
      JWT_SECRET_KEY: "ci-jwt-secret-do-not-use-in-prod"
      SECRET_KEY: "ci-secret-do-not-use-in-prod"
      GEMINI_API_KEY: "ci-fake-gemini-key"
      GOOGLE_CLIENT_ID: "ci-fake-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-fake-google-client-secret"
      FRONTEND_URL: "http://localhost:5173"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies (lightweight – no torch/umap/spacy)
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: test
    # Only build the image on pushes to main or develop (not on PRs)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: researchmate-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
