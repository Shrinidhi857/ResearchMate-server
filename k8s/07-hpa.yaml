apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: researchmate-api-hpa
  namespace: researchmate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: researchmate-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
