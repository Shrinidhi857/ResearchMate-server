apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchmate-api
  namespace: researchmate
  labels:
    app.kubernetes.io/name: researchmate-api
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: researchmate-api
  template:
    metadata:
      labels:
        app: researchmate-api
    spec:
      serviceAccountName: researchmate-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/researchmate-api:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "scripts/entrypoint.sh"]
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: researchmate-config
            - secretRef:
                name: researchmate-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2.5Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
