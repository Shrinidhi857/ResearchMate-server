apiVersion: v1
kind: ServiceAccount
metadata:
  name: researchmate-api-sa
  namespace: researchmate
  annotations:
    # IAM Roles for Service Accounts (IRSA)
    # AWS EKS maps this ServiceAccount to the IAM role that has S3 permissions
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/researchmate-eks-s3-role
