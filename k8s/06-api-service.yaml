apiVersion: v1
kind: Service
metadata:
  name: researchmate-api-service
  namespace: researchmate
  labels:
    app: researchmate-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5000
      name: http
      protocol: TCP
  selector:
    app: researchmate-api
