apiVersion: v1
kind: ConfigMap
metadata:
  name: researchmate-config
  namespace: researchmate
data:
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "researchmate-documents"
  FRONTEND_URL: "https://yourdomain.com"
  REDIS_URL: "redis://redis-service.researchmate.svc.cluster.local:6379/0"
  UVICORN_WORKERS: "2"
  NUMBA_CACHE_DIR: "/tmp"
  MPLCONFIGDIR: "/tmp"
