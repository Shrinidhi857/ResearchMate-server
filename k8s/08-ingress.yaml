apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: researchmate-ingress
  namespace: researchmate
  annotations:
    # ── AWS Load Balancer Controller (ALB) ──────────────────────────────────
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Idle timeout for long-running RAG queries & WebSockets
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300

    # ── HTTPS Configuration (Uncomment when ACM certificate & custom domain are ready)
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:${AWS_REGION}:${ACCOUNT_ID}:certificate/YOUR_ACM_CERT_ID"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: researchmate-api-service
                port:
                  number: 5000
